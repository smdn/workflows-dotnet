# ref: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:53"
      timezone: "Asia/Tokyo"
    groups:
      GitHub-Actions-Workflows:
        patterns:
          - "actions/*"
      GitHub-CodeQL-Actions:
        patterns:
          - "github/codeql-action/*"
      smdn-workflows-dotnet:
        patterns:
          - "smdn/workflows-dotnet/*"
    ignore:
      # actions/checkout: report major updates only
      - dependency-name: "actions/checkout"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # github/codeql-action: report major and minor updates only
      - dependency-name: "github/codeql-action/*"
        update-types:
          - "version-update:semver-patch"
    assignees:
      - smdn
